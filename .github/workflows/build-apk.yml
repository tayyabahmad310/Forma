name: Build Android APK (Local/Offline)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 6. Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 7. Install NPM Dependencies
        run: |
          npm install

      - name: 8. Run Automated Accounting & Business Calculation Tests
        run: |
          npm test

      - name: 9. Prepare Gradle Wrapper Permissions
        run: |
          sed -i -e 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: 10. Build Android APK(s)
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          cd android
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          elif [ "$BUILD_TYPE" = "both" ]; then
            ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: 11. Upload Release APK Artifact
        if: github.event.inputs.build_type != 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: clothio-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 12. Upload Debug APK Artifact
        if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: clothio-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 13. Create GitHub Release with APK (on git tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
